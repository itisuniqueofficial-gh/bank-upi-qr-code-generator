name: Lock issues

on:
  schedule:
    - cron: "0 0 * * *"

  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - name: Lock old, resolved issues and PRs
        uses: dessant/lock-threads@v5
        with:
          issue-inactive-days: "90"
          pr-inactive-days: "90"
          exclude-any-issue-labels: "pinned,security"
          exclude-any-pr-labels: "pinned,security"
          add-issue-labels: "locked"
          add-pr-labels: "locked"
