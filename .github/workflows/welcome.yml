name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const isIssue = context.payload.issue !== undefined;
            const number = isIssue ? context.payload.issue.number : context.payload.pull_request.number;
            const author = isIssue ? context.payload.issue.user.login : context.payload.pull_request.user.login;

            async function hasContributed() {
              const { data: issues } = await github.rest.issues.listForRepo({
                ...repo,
                state: 'all',
                creator: author,
                per_page: 1,
              });
              const { data: prs } = await github.rest.pulls.list({
                ...repo,
                state: 'all',
                head: `${author}:*`,
                per_page: 1,
              });
              return issues.length > 0 || prs.length > 0;
            }

            if (await hasContributed()) return;

            const body = `Thanks for opening your first ${isIssue ? 'issue' : 'pull request'} on the **UPI QR Code Generator**! 🎉\n\nPlease make sure you've reviewed our [CONTRIBUTING guide](https://github.com/${repo.owner}/${repo.repo}/blob/main/.github/CONTRIBUTING.md) and the [Code of Conduct](https://github.com/${repo.owner}/${repo.repo}/blob/main/.github/CODE_OF_CONDUCT.md).`;

            if (isIssue) {
              await github.rest.issues.createComment({ ...repo, issue_number: number, body });
            } else {
              await github.rest.pulls.createReview({
                ...repo,
                pull_number: number,
                body,
                event: 'COMMENT',
              });
            }
