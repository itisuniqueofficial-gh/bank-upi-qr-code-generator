# Funding

The UPI QR Code Generator is free and open source. If you find it useful, please
consider supporting the project.

## Ways to support

- ⭐ Star the repository
- 🐛 Report bugs and 💡 propose features via [Issues](../../issues)
- 📣 Share the project with others

## Funding platforms

_Open the list below and update once a funding channel is configured._

- [ ] GitHub Sponsors — https://github.com/sponsors/itisuniqueofficial-gh
- [ ] Ko-fi
- [ ] Buy Me a Coffee
- [ ] Patreon

> The `FUNDING.yml` file only supports the platforms listed in the
> [GitHub Sponsors documentation](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository).
